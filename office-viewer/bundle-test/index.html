<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaultar Office Viewer</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="toolbar">
        <div class="toolbar-group">
            <button id="open" type="button">Open Office File</button>
            <input id="file-picker" type="file" accept=".docx,.xlsx,.ppt,.pptx">
            <span id="file-name" class="file-name">No document selected</span>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group">
            <button id="previous" type="button" disabled>Previous Page</button>
            <button id="next" type="button" disabled>Next Page</button>
        </div>
        <div class="toolbar-group">
            <button id="zoom-out" type="button" disabled>−</button>
            <button id="zoom-in" type="button" disabled>+</button>
            <button id="fit-width" type="button" disabled>Fit Width</button>
            <button id="fit-page" type="button" disabled>Fit Page</button>
        </div>
        <div class="toolbar-group">
            <input id="search-input" type="text" placeholder="Search document..." autocomplete="off" spellcheck="false"
                disabled>
            <button id="search" type="button" disabled>Search</button>
            <button id="previous-match" type="button" disabled>↑ Match</button>
            <button id="next-match" type="button" disabled>↓ Match</button>
            <button id="clear-search" type="button" disabled>Clear</button>
            <span id="search-count" class="search-count"></span>
        </div>
        <div class="toolbar-group">
            <button id="print" type="button" disabled>Print</button>
            <button id="light" type="button" disabled>Light</button>
            <button id="dark" type="button" disabled>Dark</button>
            <button id="close" type="button" disabled>Close</button>
            <button id="destroy" type="button" disabled>Destroy</button>
        </div>
    </div>
    <div id="status" class="status">Ready — Office files only</div>
    <main id="viewer">
        <div id="empty-state" class="empty-state">Open a DOCX, XLSX, PPT, or PPTX file.</div>
    </main>
    <!-- UMD build produced by Vite -->
    <script src="../dist/index.umd.js"></script>
    <!-- Application logic -->
    <script src="./viewer.js"></script>
</body>

</html>
